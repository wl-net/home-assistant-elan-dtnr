name: Release

on:
  push:
    tags: ["v*"]

# Nothing gets write access by default; only the publish job asks for it.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check the tag matches manifest.json
        run: |
          python - "${GITHUB_REF_NAME#v}" <<'PY'
          import json, sys
          version = json.load(open("custom_components/elan_dtnr/manifest.json"))["version"]
          if version != sys.argv[1]:
              sys.exit(f"Tag is {sys.argv[1]} but manifest.json says {version}: bump the manifest, commit, and retag.")
          PY

      - name: Test
        run: |
          python -m venv .venv
          .venv/bin/pip install pytest-homeassistant-custom-component serialx==1.11.0
          .venv/bin/pytest

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # No third-party packages are installed in this job, which holds the
      # write token: it only zips the committed files and publishes them.
      - name: Build the zip
        run: |
          cd custom_components/elan_dtnr
          zip -r ../../elan_dtnr.zip . -x "__pycache__/*" "*.pyc"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" elan_dtnr.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
